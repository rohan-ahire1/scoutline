<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client workspace — design prototype</title>
<style>
  /* Prototype tokens, mirroring the app theme (light). */
  :root {
    --bg: #f5f0e6;
    --surface: #fffefb;
    --surface-muted: #f7f4ec;
    --text: #191847;
    --text-soft: #3f3e69;
    --muted: #55566e;
    --subtle: #6f7093;
    --border: rgba(25, 24, 71, .12);
    --border-soft: rgba(25, 24, 71, .07);
    --primary: #1e1b4b;
    --primary-hover: #2b2870;
    --green: #27845a;
    --green-bg: #effaf2;
    --red: #c5473d;
    --red-bg: #fdeeec;
    --amber: #b7771f;
    --amber-bg: #fdf0e3;
    --blue: #315d86;
    --blue-bg: #eff5ff;
    --lav-bg: #f4f1ff;
    --peach-bg: #fff6ec;
    --fs-name: 27px;
    --fs-section: 19px;
    --fs-body: 15px;
    --fs-small: 14px;
    --fs-meta: 12px;
    --r-md: 6px;
    --r-lg: 8px;
    --r-xl: 10px;
    --r-pill: 999px;
    --shadow-pop: 0 18px 46px rgba(25, 24, 71, .16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--fs-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* Prototype-only state switcher bar. */
  .proto-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px;
    background: var(--primary); color: #fff;
    font-size: 13px;
  }
  .proto-bar strong { font-weight: 700; }
  .proto-bar .states { display: flex; gap: 6px; }
  .proto-bar button {
    border: 1px solid rgba(255,255,255,.35); border-radius: var(--r-pill);
    background: transparent; color: #fff;
    font: inherit; padding: 4px 12px; cursor: pointer;
  }
  .proto-bar button[aria-pressed="true"] { background: #fff; color: var(--primary); font-weight: 700; }
  .workspace { max-width: 1060px; margin: 0 auto; padding: 0 20px 80px; }

  /* Context row: back + prev/next. */
  .context-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 0 10px;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-soft); font-size: var(--fs-small); font-weight: 600;
    background: none; border: 0; padding: 4px 0; cursor: pointer;
  }
  .back-link:hover { color: var(--text); }
  .back-link svg { width: 14px; height: 14px; flex: none; }
  .pager { display: flex; align-items: center; gap: 4px; color: var(--subtle); font-size: var(--fs-meta); }
  .icon-btn {
    width: 30px; height: 30px; display: inline-grid; place-items: center;
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--surface); color: var(--text-soft); cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--text-soft); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Identity bar: compact, ~100px. */
  .identity {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 16px 20px 14px;
  }
  .identity-top { display: flex; align-items: flex-start; gap: 16px; }
  .identity-main { min-width: 0; flex: 1; }
  .identity-main h1 {
    margin: 0; font-size: var(--fs-name); font-weight: 800; letter-spacing: -.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .identity-sub {
    margin: 3px 0 0; color: var(--muted); font-size: var(--fs-small);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .identity-sub a { color: var(--blue); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }
  .identity-sub a:hover { text-decoration: underline; }
  .identity-sub svg { width: 12px; height: 12px; }
  .identity-side { display: flex; align-items: center; gap: 8px; flex: none; }
  .stage-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: var(--r-pill);
    font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .stage-chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .stage-review { background: var(--lav-bg); color: #4b4494; }
  .stage-collected { background: var(--surface-muted); color: var(--muted); }
  .stage-qualified { background: var(--green-bg); color: var(--green); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: var(--r-lg); font: inherit; cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary {
    border: 1px solid var(--primary); background: var(--primary); color: #fff;
    font-size: var(--fs-small); font-weight: 700; padding: 8px 16px;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: var(--fs-small); font-weight: 600; padding: 7px 13px;
  }
  .btn-secondary:hover { border-color: var(--text-soft); }
  .btn svg { width: 14px; height: 14px; }
  details.record-details { margin-top: 10px; }
  details.record-details summary {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--subtle); font-size: var(--fs-meta); font-weight: 600;
    cursor: pointer; list-style: none;
  }
  details.record-details summary::-webkit-details-marker { display: none; }
  details.record-details summary:hover { color: var(--text); }
  details.record-details summary svg { width: 12px; height: 12px; transition: transform 120ms; }
  details.record-details[open] summary svg { transform: rotate(180deg); }
  .record-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 4px 24px; margin: 10px 0 2px; padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }
  .record-grid div { display: flex; gap: 8px; font-size: var(--fs-meta); padding: 3px 0; }
  .record-grid dt { color: var(--subtle); flex: none; }
  .record-grid dd { margin: 0; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .record-grid dd.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

  /* Tabs: sticky under the identity block. */
  .tabs {
    position: sticky; top: 41px; z-index: 20;
    display: flex; gap: 2px;
    margin-top: 14px; padding: 0 4px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--muted); font-size: var(--fs-small); font-weight: 600;
    padding: 10px 12px; cursor: pointer;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { border-color: var(--primary); color: var(--text); font-weight: 700; }
  .tabs button .count {
    margin-left: 6px; padding: 1px 7px; border-radius: var(--r-pill);
    background: var(--surface-muted); border: 1px solid var(--border-soft);
    color: var(--subtle); font-size: var(--fs-meta); font-weight: 700;
  }

  /* Content: main + supporting column. */
  .content { padding-top: 22px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
  section.block { margin: 0 0 30px; }
  section.block > h2 { margin: 0 0 4px; font-size: var(--fs-section); font-weight: 800; letter-spacing: -.01em; }
  section.block > .lede { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-small); }
  .next-step {
    border: 1px solid var(--border); border-radius: var(--r-xl);
    background: var(--surface); padding: 16px 18px;
    display: grid; gap: 8px;
  }
  .next-step .why { margin: 0; color: var(--text-soft); font-size: var(--fs-body); }
  .next-step .why strong { color: var(--text); }
  .next-step .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .conflict {
    border-radius: var(--r-lg); background: var(--amber-bg); color: #6b4a12;
    font-size: var(--fs-small); padding: 9px 12px;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .conflict svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .summary-text { margin: 0; font-size: var(--fs-body); color: var(--text-soft); max-width: 62ch; }
  .summary-text a { color: var(--blue); }
  .kv { margin: 12px 0 0; padding: 0; }
  .kv > div {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid var(--border-soft);
    font-size: var(--fs-small);
  }
  .kv > div:first-child { border-top: 0; }
  .kv dt { width: 110px; flex: none; color: var(--subtle); }
  .kv dd { margin: 0; min-width: 0; flex: 1; color: var(--text); overflow-wrap: anywhere; }
  .kv dd.missing { color: var(--subtle); font-style: italic; }
  .kv .mini-btn {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: none; color: var(--muted); font-size: var(--fs-meta); font-weight: 600;
    padding: 3px 8px; cursor: pointer;
  }
  .kv .mini-btn:hover { color: var(--text); border-color: var(--text-soft); }
  .kv .mini-btn svg { width: 11px; height: 11px; }
  .activity { list-style: none; margin: 12px 0 0; padding: 0; display: grid; }
  .activity li {
    display: flex; gap: 10px; padding: 8px 0;
    border-top: 1px solid var(--border-soft); font-size: var(--fs-small);
  }
  .activity li:first-child { border-top: 0; }
  .activity svg { width: 14px; height: 14px; flex: none; margin-top: 3px; color: var(--subtle); }
  .activity time { margin-left: auto; flex: none; color: var(--subtle); font-size: var(--fs-meta); }
  .text-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--blue); font-size: var(--fs-small); font-weight: 600;
  }
  .text-btn:hover { text-decoration: underline; }
  .empty-note {
    border: 1px dashed var(--border); border-radius: var(--r-lg);
    padding: 18px; color: var(--muted); font-size: var(--fs-small);
    display: grid; gap: 8px; background: var(--surface);
  }
  .empty-note strong { color: var(--text); font-size: var(--fs-body); }

  /* Research tab. */
  .reco {
    border: 1px solid var(--border); border-radius: var(--r-xl);
    background: var(--surface); padding: 16px 18px;
    display: grid; gap: 6px; margin-bottom: 26px;
  }
  .reco .verdict { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .reco .verdict strong { font-size: var(--fs-section); font-weight: 800; letter-spacing: -.01em; }
  .reco p { margin: 0; color: var(--text-soft); font-size: var(--fs-body); max-width: 64ch; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: var(--r-pill);
    font-size: var(--fs-meta); font-weight: 700; white-space: nowrap;
  }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-green { background: var(--green-bg); color: var(--green); }
  .pill-amber { background: var(--amber-bg); color: var(--amber); }
  .pill-blue { background: var(--blue-bg); color: var(--blue); }
  .pill-neutral { background: var(--surface-muted); color: var(--muted); }
  .finding {
    border: 1px solid var(--border); border-radius: var(--r-xl);
    background: var(--surface); margin-bottom: 10px; overflow: hidden;
  }
  .finding summary {
    display: flex; align-items: baseline; gap: 10px;
    padding: 13px 16px; cursor: pointer; list-style: none;
    font-size: var(--fs-body); font-weight: 700;
  }
  .finding summary::-webkit-details-marker { display: none; }
  .finding summary:hover { background: var(--surface-muted); }
  .finding summary .n {
    flex: none; width: 22px; height: 22px; align-self: center;
    display: inline-grid; place-items: center;
    border-radius: 50%; background: var(--peach-bg);
    color: var(--text-soft); font-size: var(--fs-meta); font-weight: 700;
  }
  .finding summary svg { width: 14px; height: 14px; margin-left: auto; flex: none; align-self: center; color: var(--subtle); transition: transform 120ms; }
  .finding[open] summary svg { transform: rotate(180deg); }
  .finding .detail { padding: 0 16px 16px 48px; display: grid; gap: 10px; }
  .finding .detail h4 {
    margin: 0; font-size: var(--fs-meta); font-weight: 700;
    color: var(--subtle); text-transform: uppercase; letter-spacing: .05em;
  }
  .finding .detail h4 + p { margin: 2px 0 0; }
  .finding .detail p { font-size: var(--fs-small); color: var(--text-soft); max-width: 64ch; }
  .evidence {
    display: grid; gap: 6px;
    border-radius: var(--r-lg); background: var(--surface-muted);
    padding: 10px 12px; font-size: var(--fs-small);
  }
  .evidence div { display: flex; gap: 8px; min-width: 0; }
  .evidence dt { flex: none; width: 86px; color: var(--subtle); }
  .evidence dd { margin: 0; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evidence dd.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .evidence a { color: var(--blue); }
  .limit {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: var(--fs-small); color: var(--muted);
  }
  .limit svg { width: 14px; height: 14px; flex: none; margin-top: 3px; color: var(--subtle); }
  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--border); border-radius: var(--r-xl);
    background: var(--surface); padding: 14px 16px; margin-bottom: 22px;
    font-size: var(--fs-small); color: var(--text-soft);
  }
  .notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
  .notice.dup { border-color: rgba(89, 99, 168, .3); background: var(--lav-bg); }
  .notice.warn { border-color: rgba(183, 119, 31, .3); background: var(--amber-bg); }
  .notice .grow { flex: 1; min-width: 0; }
  .details-group {
    border: 1px solid var(--border); border-radius: var(--r-xl);
    background: var(--surface); margin: 26px 0 30px; overflow: hidden;
  }
  .details-group > summary {
    padding: 13px 16px; cursor: pointer; list-style: none;
    font-size: var(--fs-body); font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .details-group > summary::-webkit-details-marker { display: none; }
  .details-group > summary svg { width: 14px; height: 14px; margin-left: auto; color: var(--subtle); }
  .details-group .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 4px 24px; padding: 0 16px 16px;
  }
  .details-group .grid div { padding: 7px 0; border-top: 1px solid var(--border-soft); font-size: var(--fs-small); }
  .details-group .grid dt { color: var(--subtle); font-size: var(--fs-meta); margin-bottom: 1px; }
  .details-group .grid dd { margin: 0; color: var(--text); }
  .score-line { display: flex; align-items: baseline; gap: 10px; }
  .score-line strong { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .score-line span { color: var(--subtle); font-size: var(--fs-meta); }
  .reserved {
    border: 1px dashed var(--border); border-radius: var(--r-xl);
    background: var(--surface); padding: 26px; color: var(--muted);
    font-size: var(--fs-small); max-width: 62ch;
  }
  .reserved strong { display: block; color: var(--text); font-size: var(--fs-body); margin-bottom: 4px; }
  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
    .identity-top { flex-direction: column; }
    .identity-side { width: 100%; }
    .identity-side .btn-primary { flex: 1; justify-content: center; }
    .identity-main h1 { white-space: normal; }
    .tabs { top: 41px; overflow-x: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    details summary svg { transition: none; }
  }
</style>
</head>

<header class="proto-bar">
  <strong>Design prototype · Client workspace</strong>
  <div class="states" role="group" aria-label="Client state">
    <button data-state="awaiting" aria-pressed="true">A · Awaiting decision</button>
    <button data-state="unanalyzed" aria-pressed="false">B · Not analyzed</button>
    <button data-state="qualified" aria-pressed="false">C · Qualified</button>
  </div>
</header>

let cur = 'awaiting';
let tab = 'overview';
const $ = (id) => document.getElementById(id);

function renderIdentity(s) {
  $('backLabel').textContent = s.back;
  $('pagerPos').textContent = s.pos;
  $('bizName').textContent = s.name;
  $('bizSub').innerHTML =
    `<span>${s.sub[0]}</span><span aria-hidden="true">·</span><span>${s.sub[1]}</span>` +
    `<a href="${s.websiteUrl}">${icon('i-globe')}${s.website}</a>`;
  $('stageChip').className = 'stage-chip ' + s.stage[1];
  $('stageChip').innerHTML = `<i aria-hidden="true"></i>${s.stage[0]}`;
  $('primaryAction').textContent = s.primary;
  $('recordGrid').innerHTML = s.record.map(([dt, dd]) =>
    `<div><dt>${dt}</dt><dd class="${/LEAD-/.test(dd) ? 'mono' : ''}" title="${dd}">${dd}</dd></div>`).join('');
  $('findingCount').textContent = s.findingCount || '';
  $('findingCount').style.display = s.findingCount ? '' : 'none';
}

function contactRow([ic, dt, dd, missing, action]) {
  return `<div><dt>${dt}</dt><dd class="${missing ? 'missing' : ''}">${missing ? dd + ' — worth capturing on first contact' : dd}</dd>` +
    (action ? `<button class="mini-btn" type="button">${icon(ic === 'i-phone' ? 'i-copy' : 'i-ext')}${action}</button>` : '') + `</div>`;
}

function renderOverview(s) {
  const summary = s.summary
    ? `<section class="block"><h2>${s.summaryTitle}</h2><p class="summary-text">${s.summary}</p></section>`
    : `<section class="block"><h2>${s.summaryTitle}</h2><div class="empty-note"><strong>Not assessed yet.</strong><span>No audit has run, so there is no summary to give — and no conclusion to draw. Run the analysis to fill this in.</span><span><button class="btn btn-secondary" type="button">Analyze website</button></span></div></section>`;
  return `<div class="cols"><main>
    <section class="block"><h2>${s.next.title}</h2>
      <div class="next-step"><p class="why">${s.next.why}</p>
        <div class="row">${s.next.actions.map(([label, cls]) => `<button class="btn ${cls}" type="button">${label}</button>`).join('')}</div>
      </div>
    </section>
    ${summary}
  </main><aside>
    <section class="block"><h2>Contact details</h2><dl class="kv">${s.contacts.map(contactRow).join('')}</dl></section>
    <section class="block"><h2>Recent activity</h2>
      <ul class="activity">${s.activity.map(([ic, text, time]) => `<li>${icon(ic)}<span>${text}</span><time>${time}</time></li>`).join('')}</ul>
      <p style="margin:10px 0 0"><button class="text-btn" type="button">View all activity</button></p>
    </section>
  </aside></div>`;
}

function findingCard(f, i) {
  return `<details class="finding"${i === 0 ? ' open' : ''}><summary><span class="n">${i + 1}</span><span>${f.t}</span>${icon('i-chev')}</summary>
    <div class="detail">
      <div><h4>Why it matters</h4><p>${f.why}</p></div>
      <div><h4>Evidence</h4><dl class="evidence">${f.ev.map(([dt, dd]) =>
        `<div><dt>${dt}</dt><dd class="${/https?:/.test(dd) ? '' : 'mono'}"${/https?:/.test(dd) ? '' : ' title="' + dd + '"'}>${/https?:/.test(dd) ? `<a href="${dd}">${dd}</a>` : dd}</dd></div>`).join('')}</dl></div>
      <div class="limit">${icon('i-info')}<span><strong>Limitation:</strong> ${f.limit}</span></div>
    </div></details>`;
}

function renderResearch(s) {
  if (!s.reco) {
    return `<section class="block"><h2>Research</h2>
      <div class="empty-note"><strong>No research yet.</strong>
      <span>Findings, evidence, and the recommendation will appear here after the first audit. Nothing is wrong — this record simply has not been analyzed.</span>
      <span><button class="btn btn-secondary" type="button">Analyze website</button></span></div></section>`;
  }
  return `
    ${s.dup ? `<div class="notice dup">${icon('i-layers')}<span class="grow"><strong>Possible duplicate.</strong> ${s.dup}</span><button class="btn btn-secondary" type="button">Compare records</button></div>` : ''}
    <section class="block"><h2>Recommendation</h2>
      <div class="reco"><div class="verdict"><span class="pill ${s.reco.pill[1]}"><i></i>${s.reco.pill[0]}</span><strong>${s.reco.title}</strong></div>
      <p>${s.reco.text}</p></div>
    </section>
    <section class="block"><h2>Findings</h2>
      <p class="lede">Each finding states what was observed, why it matters, and what remains uncertain. Open one to inspect its evidence.</p>
      ${s.findings.map(findingCard).join('')}
    </section>
    <section class="block"><h2>Score</h2>
      <div class="score-line"><strong>${s.score[0]}</strong><span>${s.score[1]}</span></div>
    </section>
    <details class="details-group"><summary>${icon('i-file')}Research details${icon('i-chev')}</summary>
      <div class="grid">${s.details.map(([dt, dd]) => `<div><dt>${dt}</dt><dd>${dd}</dd></div>`).join('')}</div>
    </details>`;
}

function renderReserved(title, body) {
  return `<section class="block"><h2>${title}</h2><div class="reserved"><strong>Designed next.</strong>${body}</div></section>`;
}

function render() {
  const s = STATES[cur];
  renderIdentity(s);
  document.querySelectorAll('.tabs [role="tab"]').forEach((b) =>
    b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'));
  const el = $('content');
  if (tab === 'overview') el.innerHTML = renderOverview(s);
  else if (tab === 'research') el.innerHTML = renderResearch(s);
  else if (tab === 'outreach') el.innerHTML = renderReserved('Outreach', 'Drafts, contact channels, attempts, replies, and follow-up will live here — reusing the finding and evidence structure above rather than duplicating it.');
  else el.innerHTML = renderReserved('Activity', 'Notes and a chronological history of research, decisions, outreach, and stage changes will live here, fed by the same events already shown under Recent activity.');
  el.querySelectorAll('[data-goto]').forEach((a) => a.addEventListener('click', (ev) => {
    ev.preventDefault(); setTab('research');
  }));
  window.scrollTo(0, 0);
}
function setTab(next) {
  tab = next; render();
  document.querySelector('.tabs').scrollIntoView({ block: 'start' });
}
document.querySelectorAll('.proto-bar [data-state]').forEach((b) => b.addEventListener('click', () => {
  cur = b.dataset.state; tab = 'overview';
  document.querySelectorAll('.proto-bar [data-state]').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
}));
document.querySelectorAll('.tabs [role="tab"]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
render();
</script>
