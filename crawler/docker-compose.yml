services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crawler_pg:/var/lib/postgresql/data

volumes:
  crawler_pg:
